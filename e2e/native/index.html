<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Regresión nativa de formularios</title>
    <style>
      body { max-width: 850px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; }
      button { padding: .6rem 1rem; font: inherit; }
      li { margin-block: .5rem; }
      [data-result="passed"] { color: #14532d; }
      [data-result="failed"] { color: #991b1b; }
    </style>
  </head>
  <body>
    <h1>Regresión nativa de formularios</h1>
    <p>Ejecuta las comprobaciones de la unidad 12 en vistas previas aisladas. No modifica progreso ni consulta una API.</p>
    <button id="run" type="button">Ejecutar regresiones</button>
    <p id="summary" role="status">Sin ejecutar</p>
    <ol id="results"></ol>
    <script type="module" src="./form-contracts.ts"></script>
  </body>
</html>

name: Community improvement validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: community-improvement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-community-change:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout untrusted change
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm lint

      - name: Test all courses and runtimes
        run: pnpm test

      - name: Production build
        run: pnpm build
